<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BodhiBot - Sign Up</title>
  <link
      rel="stylesheet"
      href="{{ url_for('static', filename='sign-up.css') }}"
    />
</head>
<body>

  <div class="container">

    <div class="signup-box">

      <!-- Logo -->
      <img class="logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="BodhiBot-logo">

      <h1>Create Account</h1>
      <p class="subtitle">Join BodhiBot today</p>

      <form action="/signup" method="POST">

        <div class="input-group">
          <input type="text" placeholder="Full Name" name="username" required>
        </div>

        <div class="input-group">
          <input type="email" placeholder="Email Address" name="email" required>
        </div>

        <div class="input-group">
          <input type="password" placeholder="Password" name="password" required>
        </div>

        <div class="input-group">
          <input type="password" placeholder="Confirm Password" name="confirm_password" required>
        </div>

        <button type="submit" class="signup-btn">
          Sign Up
        </button>

      </form>

      <p class="login-text">
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
      </p>

    </div>

  </div>

</body>
</html>
